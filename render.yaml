# Render Blueprint for ScopeGuard — https://render.com/docs/blueprint-spec
#
# scopeguard          Django API on api.scopeguard.icvn.tech (the SPA is on Vercel)
# scopeguard-cache    Key Value (Redis) for Django's cache and API throttling
# scopeguard-db       PostgreSQL

services:
  - type: web
    name: scopeguard
    runtime: docker
    plan: starter
    dockerfilePath: ./compose/production/django/Dockerfile
    dockerContext: .
    dockerCommand: /start
    preDeployCommand: python manage.py migrate --noinput
    domains:
      - api.scopeguard.icvn.tech
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ADMIN_URL
        sync: false # e.g. "a-long-random-path/" (keep the trailing slash)
      # The Vercel frontend proxies /api, /accounts and /static here, so the
      # browser's Origin is the frontend while the Host is the API.
      - key: DJANGO_ALLOWED_HOSTS
        value: api.scopeguard.icvn.tech,scopeguard.icvn.tech
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://scopeguard.icvn.tech,https://api.scopeguard.icvn.tech
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://scopeguard.icvn.tech
      - key: FRONTEND_URL
        value: https://scopeguard.icvn.tech
      - key: DATABASE_URL
        fromDatabase:
          name: scopeguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: scopeguard-cache
          property: connectionString
      # Hosted open-weight model (OpenAI-compatible API)
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: SCOPE_CHECK_THROTTLE_RATE
        value: 30/hour
      - key: WEB_CONCURRENCY
        value: "2"
      # S3 is optional and off: ScopeGuard stores no user files. To turn it
      # on, set DJANGO_AWS_STORAGE_BUCKET_NAME, DJANGO_AWS_ACCESS_KEY_ID and
      # DJANGO_AWS_SECRET_ACCESS_KEY in the dashboard.
      # Mailgun (signup verification emails). Optional: leave MAILGUN_API_KEY
      # blank and sign-ups skip email verification.
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      # Sentry
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"

  - type: keyvalue
    name: scopeguard-cache
    plan: free
    ipAllowList: [] # private network only

databases:
  - name: scopeguard-db
    plan: basic-256mb
    databaseName: scopeguard
    user: scopeguard
